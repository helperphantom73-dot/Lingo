name: Generate Project And Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ساخت ۱۰۰٪ مستقیم تمام فایل‌های پروژه اندروید
      - name: Recreate Complete Android Project Structure
        run: |
          mkdir -p gradle/wrapper
          mkdir -p app/src/main/java/com/lingoworld/app/data/datastore
          mkdir -p app/src/main/java/com/lingoworld/app/data/model
          mkdir -p app/src/main/java/com/lingoworld/app/data/room
          mkdir -p app/src/main/java/com/lingoworld/app/engine
          mkdir -p app/src/main/java/com/lingoworld/app/ui/components
          mkdir -p app/src/main/java/com/lingoworld/app/ui/screens/onboarding
          mkdir -p app/src/main/java/com/lingoworld/app/ui/theme
          mkdir -p app/src/main/res/values

          # 1. settings.gradle.kts
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "LingoWorld"
          include(":app")
          EOF

          # 2. build.gradle.kts (Root)
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.4.1" apply false
              id("org.jetbrains.kotlin.android") version "1.9.23" apply false
              id("com.google.devtools.ksp") version "1.9.23-1.0.20" apply false
          }
          EOF

          # 3. gradle-wrapper.properties
          cat << 'EOF' > gradle/wrapper/gradle-wrapper.properties
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          # 4. app/build.gradle.kts
          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("com.google.devtools.ksp")
          }

          android {
              namespace = "com.lingoworld.app"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.lingoworld.app"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0.0"
                  testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
                  vectorDrawables { useSupportLibrary = true }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              buildFeatures {
                  compose = true
              }
              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.11"
              }
              packaging {
                  resources {
                      excludes += "/META-INF/{AL2.0,LGPL2.1}"
                  }
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.7.0")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0")
              implementation("androidx.activity:activity-compose:1.9.0")
              implementation(platform("androidx.compose:compose-bom:2024.05.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.navigation:navigation-compose:2.7.7")
              val roomVersion = "2.6.1"
              implementation("androidx.room:room-runtime:$roomVersion")
              implementation("androidx.room:room-ktx:$roomVersion")
              ksp("androidx.room:room-compiler:$roomVersion")
              implementation("androidx.datastore:datastore-preferences:1.1.1")
              implementation("androidx.work:work-runtime-ktx:2.9.0")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.0")
          }
          EOF

          # 5. app/src/main/AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:label="LingoWorld"
                  android:roundIcon="@android:drawable/sym_def_app_icon"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 6. strings.xml
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">LingoWorld</string>
          </resources>
          EOF

          # 7. proguard-rules.pro
          cat << 'EOF' > app/proguard-rules.pro
          -keepattributes *Annotation*
          -keepclassmembers class * {
              @androidx.room.* <methods>;
          }
          EOF

          # بررسی اگر کدهای سورس روی مخزن نیستند، از فایل متنی استخراج شوند
          python3 - << 'PYEOF'
          import os, re
          for root, dirs, files in os.walk('.'):
              for f in files:
                  if f.endswith(('.txt', '.md', '.log', '.dump')) or f in ['code', 'dump']:
                      try:
                          with open(os.path.join(root, f), 'r', encoding='utf-8', errors='ignore') as fp:
                              txt = fp.read()
                              if "--- START OF FILE" in txt:
                                  for p, b, _ in re.findall(r'---\s*START OF FILE\s+([^\s\-]+)\s*---\n(.*?)((?=---\s*START OF FILE)|$)', txt, re.DOTALL):
                                      p = p.strip()
                                      os.makedirs(os.path.dirname(p), exist_ok=True)
                                      with open(p, 'w', encoding='utf-8') as out:
                                          out.write(b.strip() + "\n")
                                      print("Extracted from file:", p)
                      except Exception:
                          pass
          PYEOF

      # آماده کردن گریدل اختصاصی و مجوزها
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      # ساخت فایل APK
      - name: Build APK with Gradle CLI
        run: |
          # پذیرش لایسنس‌های اندروید
          yes | sdkmanager --licenses || true
          gradle :app:assembleDebug -x test -x lint --stacktrace

      # ذخیره و دانلود فایل APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LingoWorld-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Create Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.0-build-${{ github.run_number }}"
          name: "LingoWorld APK #${{ github.run_number }}"
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
