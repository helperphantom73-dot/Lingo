name: Unzip And Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ۱. آنزیپ کردن فایل زیپ پروژه
      - name: Extract lingoworld-fixed.zip
        run: |
          if [ -f "lingoworld-fixed.zip" ]; then
            echo "Unzipping lingoworld-fixed.zip..."
            unzip -o lingoworld-fixed.zip -d ./extracted_project
            # انتقال فایل‌ها به روت اصلی
            cd extracted_project
            # پیدا کردن پوشه‌ای که حاوی settings.gradle یا app است
            if [ -d "app" ] || [ -f "settings.gradle.kts" ] || [ -f "settings.gradle" ]; then
              cp -r ./* ../
            else
              # اگر داخل یک زیرپوشه زیپ شده بود
              SUBDIR=$(find . -maxdepth 2 -type d -name "app" -exec dirname {} \; | head -n 1)
              if [ -n "$SUBDIR" ]; then
                cp -r $SUBDIR/* ../
              else
                cp -r ./* ../
              fi
            fi
            cd ..
            rm -rf extracted_project
          else
            echo "File lingoworld-fixed.zip not found, checking existing files..."
          fi

      # ۲. مطمئن شدن از وجود AndroidManifest در صورت فراموشی در سورس
      - name: Ensure AndroidManifest
        run: |
          mkdir -p app/src/main/res/values
          if [ ! -f "app/src/main/AndroidManifest.xml" ]; then
            cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:label="LingoWorld"
                  android:roundIcon="@android:drawable/sym_def_app_icon"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          fi

      # ۳. تنظیم جاوا ۱۷
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ۴. تنظیم گریدل ۸.۷ پایدار
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      # ۵. بیلد کردن فایل APK با Android SDK پیش‌فرض سیستم گیت‌هاب
      - name: Build APK
        run: |
          chmod +x ./gradlew 2>/dev/null || true
          
          # اگر فایل gradlew وجود داشت با اون اجرا کن، وگرنه با gradle سیستمی
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug -x test -x lint --stacktrace
          else
            gradle assembleDebug -x test -x lint --stacktrace
          fi

      # ۶. خروجی و دانلود فایل APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LingoWorld-APK
          path: app/build/outputs/apk/debug/*.apk

      # ۷. ساخت ریلیز در گیت‌هاب
      - name: Create Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.0-build-${{ github.run_number }}"
          name: "LingoWorld APK #${{ github.run_number }}"
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
